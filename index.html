<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="EnviroTrack — alur pendirian usaha, penapisan, checklist, dokumen, dan basis regulasi lingkungan Indonesia.">
  <meta name="theme-color" content="#143b31">
  <title>EnviroTrack Indonesia</title>
  <link rel="preconnect" href="https://gw.oss.go.id">
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260823-19">
</head>
<body>
  <a class="skip-link" href="#main-content">Lewati ke konten utama</a>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main class="app" id="main-content">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div>
        <a class="brand" href="#beranda" data-view="home" aria-label="EnviroTrack, buka beranda">
          <span class="logo">E</span><span>EnviroTrack</span>
        </a>
        <p class="tagline">Perizinan lingkungan<br>tanpa kehilangan arah.</p>
        <nav class="nav" id="main-nav">
          <button data-view="home" aria-label="Beranda"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4Z"/><path d="M9 20v-6h6v6"/></svg></i><span>Beranda</span></button>
          <button data-view="screening" aria-label="Penapisan baru"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></svg></i><span>Penapisan baru</span></button>
          <button data-view="projects" aria-label="Proyek saya"><i aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="1"/><path d="M9 6V4h6v2"/></svg></i><span>Proyek saya</span><em class="pill">3</em></button>
          <button data-view="tasks" aria-label="Checklist tugas"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 7 2 2 4-4M13 7h6M5 14l2 2 4-4M13 14h6"/></svg></i><span>Checklist tugas</span><em class="pill" id="task-count">12</em></button>
          <button data-view="documents" aria-label="Dokumen"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6Z"/><path d="M15 3v4h4M9 12h6M9 16h6"/></svg></i><span>Dokumen</span></button>
          <button data-view="calendar" aria-label="Kalender"><i aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></i><span>Kalender</span></button>
          <button data-view="regulations" data-reg-open="all" aria-label="Basis regulasi"><i aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6Z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg></i><span>Basis regulasi</span></button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="coverage">
          <div class="cover-head"><span>Cakupan data</span><b>KBLI resmi</b></div>
          <div class="bar"><span></span></div>
          <p>38 provinsi dan 514 kabupaten/kota<br>Indeks lokal: Kalimantan Timur</p>
        </div>
        <div class="profile"><span class="avatar">ET</span><div><b>Workspace demo</b><small>Tersimpan lokal di perangkat</small></div></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div><h1 id="page-title">Proyek baru</h1></div>
        <div class="top-actions">
          <span class="autosave" id="autosave">Tersimpan di perangkat</span>
          <button class="ghost" data-action="save">Simpan draf</button>
        </div>
      </header>
      <div id="stepbar" class="stepbar"><div class="steps" id="steps"></div></div>
      <div class="content" id="content">
        <section class="panel">
          <div class="screen" id="screen"></div>
          <footer class="panel-footer" id="panel-footer">
            <button class="back" id="back">← Kembali</button>
            <span class="note">Hasil menyesuaikan data yang kamu masukkan</span>
            <button class="next" id="next">Lanjutkan <span>→</span></button>
          </footer>
        </section>
        <aside class="context" id="context" aria-label="Ringkasan proyek"></aside>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="app-20260821-17.js?v=20260823-19" defer></script>
</body>
</html>
