    const impactTasks={wastewater:[['Inventarisasi seluruh aliran air limbah','Air limbah','ready','Hari 4','Permen LHK 5/2021','Process'],['Susun kajian/standar teknis air limbah','Air limbah','blocked','Hari 12','Permen LHK 5/2021','Environment'],['Commissioning, verifikasi dan SLO','Air limbah','later','Pra-operasi','Persetujuan Teknis','Operations']],emission:[['Daftarkan setiap sumber emisi','Emisi','ready','Hari 4','Permen LHK 5/2021','Process'],['Tetapkan parameter, titik uji dan frekuensi','Emisi','blocked','Hari 10','Baku mutu sektoral','Environment'],['Verifikasi fasilitas dan SLO emisi','Emisi','later','Pra-operasi','Persetujuan Teknis','Operations']],b3:[['Klasifikasi kode dan timbulan limbah B3','Limbah B3','ready','Hari 5','Permen LHK 6/2021','Environment'],['Siapkan Rintek penyimpanan limbah B3','Limbah B3','blocked','Hari 14','Permen LHK 6/2021','Engineering']],water:[['Tentukan sumber, debit dan izin penggunaan air','Sumber daya','ready','Hari 6','PUPR 2/2024 / ESDM 4/2026','Project']],forest:[['Overlay kawasan hutan dan penapisan PPKH','Lokasi','blocked','Hari 5','Permen LHK 7/2021','GIS']],marine:[['Penapisan KKPRL dan kewenangan laut','Lokasi','blocked','Hari 5','Aturan ruang laut','Marine']]};
    function sector(){return sectors.find(x=>x.key===state.sector)}
    function tasks(){let out=[...baseTasks,...state.impacts.flatMap(k=>impactTasks[k])];if(state.sector==='migas'&&state.impacts.includes('wastewater'))out.splice(4,0,['Petakan produced water, oily water dan hydrotest','Migas','ready','Hari 5','Permen LH 19/2010','Process']);if(state.sector==='migas'&&state.impacts.includes('emission'))out.push(['Inventarisasi flare, turbine, compressor dan fugitif','Migas','ready','Hari 6','Baku mutu emisi migas/sumber','Operations']);return out}
    function heading(n,title,desc){return `<div class="heading"><span>LANGKAH ${n} DARI 5</span><h2>${title}</h2><p>${desc}</p></div>`}
    function renderSteps(){document.getElementById('steps').innerHTML=labels.map((x,i)=>`<button class="step ${i===state.step?'active':''} ${i<state.step?'done':''}" data-step="${i}"><span>${i<state.step?'✓':i+1}</span><small>${x}</small></button>`).join('');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.step;render()})}
    function renderProfile(){const s=sector();return heading(1,'Ceritakan jenis usahamu','Kami tidak hanya membaca KBLI. Pilihan ini menentukan pertanyaan proses dan regulasi sektoral berikutnya.')+`<div class="label"><b>Pilih sektor utama</b><small>Wajib diisi</small></div><div class="sectors">${sectors.map(x=>`<button class="sector ${x.key===state.sector?'selected':''}" data-sector="${x.key}"><span class="sector-icon">${x.icon}</span><div><b>${x.name}</b><small>${x.hint}</small></div><em>${x.code}</em></button>`).join('')}</div><label class="form-field">Subsektor / aktivitas utama<select id="sub">${s.subs.map(x=>`<option ${x===state.sub?'selected':''}>${x}</option>`).join('')}</select></label><div class="form-row"><label class="form-field">Status proyek<select id="project"><option>Usaha baru</option><option>Pengembangan kapasitas</option><option>Perubahan proses</option><option>Sudah beroperasi</option></select></label><label class="form-field">Perkiraan kapasitas<input placeholder="Contoh: 45.000 BOPD"></label></div>`}
    function renderImpacts(){return heading(2,'Apa saja sumber dampaknya?','Pilih semua yang ada. Sistem membuka pertanyaan rinci untuk setiap sumber, bukan memakai checklist generik.')+`<div class="impacts">${impacts.map(x=>`<button class="impact ${state.impacts.includes(x.key)?'selected':''}" data-impact="${x.key}"><span class="check">${state.impacts.includes(x.key)?'✓':''}</span><i>${x.icon}</i><b>${x.name}</b><small>${x.desc}</small></button>`).join('')}</div>${state.sector==='migas'?'<div class="smart"><span>✦</span><div><b>Pertanyaan khusus migas ditambahkan</b><p>Produced water, hydrotest, oily drainage, flare, turbine/compressor, drilling waste, TPS LB3, dan potensi tumpahan diperiksa terpisah.</p></div></div>':''}<div class="label"><b>Unit proses yang tersedia</b><small>Pilih lebih dari satu</small></div><div class="tags"><button class="tag on">Well & production</button><button class="tag on">Separator</button><button class="tag">Gathering station</button><button class="tag on">Genset</button><button class="tag">Jetty</button><button class="tag">+ Tambah unit</button></div>`}
    function renderLocation(){return heading(3,'Di mana proyek berada?','Lokasi menentukan kewenangan, sensitivitas, aturan daerah, serta izin ruang dan sumber daya yang ikut terpicu.')+`<div class="map"><span class="island one"></span><span class="island two"></span><span class="island three"></span><span class="pin">●</span><div class="mapbox"><b>Polygon belum diunggah</b><small>GeoJSON, KML, atau gambar batas tapak</small><button>Unggah polygon</button></div></div><div class="form-row"><label class="form-field">Provinsi<select id="province"><option>Kalimantan Timur</option><option>Riau</option><option>Sumatera Selatan</option><option>Jawa Barat</option><option>Sulawesi Tengah</option></select></label><label class="form-field">Kabupaten / kota<select><option>Kabupaten Kutai Kartanegara</option><option>Kota Balikpapan</option><option>Kabupaten Penajam Paser Utara</option></select></label></div><div class="checks"><label><input type="checkbox"> Berada di kawasan industri</label><label><input type="checkbox"> Beririsan kawasan hutan</label><label><input type="checkbox"> Memakai ruang laut/pesisir</label><label><input type="checkbox"> Lintas kabupaten/provinsi</label></div>`}
    function renderResult(){const s=sector(),t=tasks();return `<div class="result-head"><span class="ok">✓</span><div><label>HASIL PENAPISAN INDIKATIF</label><h2>${s.name} · ${state.sub}</h2><p>${state.project} di ${state.province}</p></div><div class="confidence"><b>87%</b><small>keyakinan hasil</small></div></div><div class="stats"><div class="stat"><small>Dokumen lingkungan</small><b>AMDAL</b><span>Perlu verifikasi skala & lokasi</span></div><div class="stat"><small>Otoritas awal</small><b>KLH / BPLH</b><span>Karena karakter kegiatan</span></div><div class="stat"><small>Kewajiban terpicu</small><b>${t.length} tugas</b><span>${state.impacts.length} aspek teknis</span></div></div><div class="alert"><span>!</span><div><b>Hasil belum final</b><p>Unggah polygon dan kapasitas desain untuk mengunci jenis dokumen dan kewenangan.</p></div><button data-goto="2">Lengkapi lokasi</button></div><h3 class="rules-title">Paket regulasi yang digunakan</h3><div class="rules"><div class="rule"><span class="badge general">UMUM</span><p><b>Persetujuan Lingkungan</b><small>PP 22/2021 · Permen LHK 4/2021</small></p><em>Aktif</em></div>${state.sector==='migas'?'<div class="rule"><span class="badge sectoral">MIGAS</span><p><b>Baku mutu air limbah migas</b><small>Permen LH 19/2010</small></p><em>Aktif</em></div>':''}<div class="rule"><span class="badge technical">TEKNIS</span><p><b>Persetujuan Teknis & SLO</b><small>Permen LHK 5/2021</small></p><em>Terpicu</em></div><div class="rule"><span class="badge project">PROYEK</span><p><b>Ketentuan daerah dan keputusan proyek</b><small>Menunggu koordinat dan dokumen lama</small></p><em>Perlu data</em></div></div>`}
    function renderTracker(){const t=tasks(),blocked=t.filter(x=>x[2]==='blocked').length,later=t.filter(x=>x[2]==='later').length;return `<div class="tracker-head"><div><span>CHECKLIST PROYEK</span><h2>${sector().name} — ${t.length} tugas</h2></div><button class="ghost">☷ Filter</button></div><div class="progress"><div class="ring"><b>18%</b></div><div class="progress-info"><b>2 tugas selesai</b><p>${blocked} menunggu prasyarat · ${later} untuk pra-operasi</p><div class="bar"><span></span></div></div></div><div class="tasklist">${t.map((x,i)=>`<article class="task"><button class="task-main" data-task="${i}"><span class="task-state ${x[2]}">${x[2]==='later'?'◷':x[2]==='blocked'?'↳':''}</span><span class="task-copy"><small>${x[1]}</small><b>${x[0]}</b><em>${x[4]}</em></span><span class="owner">${x[5]}</span><span class="due">${x[3]}</span><span>⌄</span></button>${state.open===i?'<div class="task-detail"><div><small>MENGAPA WAJIB</small><p>Jawaban proyek memicu kewajiban ini berdasarkan sektor, sumber dampak, dan tahap kegiatan.</p></div><div><small>BUKTI YANG DIBUTUHKAN</small><p>Data teknis, dokumen, bukti pengajuan, hasil review, dan nomor persetujuan.</p></div><button>Mulai tugas →</button></div>':''}</article>`).join('')}</div>`}
    function renderContext(){const s=sector(),t=tasks();document.getElementById('context').innerHTML=`<div class="context-title"><span>RINGKASAN PROYEK</span><span>×</span></div><div class="project-card"><span class="sector-icon">${s.icon}</span><div><b>${s.name}</b><small>${state.sub}</small></div><em>${s.code}</em></div><dl class="facts"><div><dt>Status</dt><dd>${state.project}</dd></div><div><dt>Lokasi</dt><dd>${state.province}</dd></div><div><dt>Sumber dampak</dt><dd>${state.impacts.length} dipilih</dd></div></dl><div class="divider"></div><div class="trigger-head"><span>YANG SUDAH TERPICU</span><b>${t.length}</b></div><div class="trigger-list"><div class="trigger"><span class="dot green-dot"></span><p><b>Dokumen lingkungan</b><small>AMDAL / UKL-UPL perlu ditapis</small></p></div>${state.impacts.includes('wastewater')?'<div class="trigger"><span class="dot blue-dot"></span><p><b>Air limbah</b><small>Pertek dan SLO</small></p></div>':''}${state.impacts.includes('emission')?'<div class="trigger"><span class="dot orange-dot"></span><p><b>Emisi</b><small>Inventaris sumber dan Pertek</small></p></div>':''}${state.impacts.includes('b3')?'<div class="trigger"><span class="dot red-dot"></span><p><b>Limbah B3</b><small>Rintek penyimpanan</small></p></div>':''}</div><div class="divider"></div><div class="legal"><span>§</span><div><b>Dasar aturan transparan</b><p>Setiap hasil menyimpan regulasi, versi efektif, dan alasan pemicu.</p><button data-goto="3">Lihat dasar hukum →</button></div></div><div class="review"><span class="review-icons"><i>LH</i><i>ET</i></span><div><b>Review ahli tersedia</b><small>Untuk hasil kompleks atau ambigu</small></div></div><p class="disclaimer">Prototipe alur produk. Hasil penapisan belum menggantikan verifikasi tenaga ahli atau keputusan instansi.</p>`}
    function wire(){document.querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>{state.sector=b.dataset.sector;state.sub=sector().subs[0];render()});document.querySelectorAll('[data-impact]').forEach(b=>b.onclick=()=>{const k=b.dataset.impact;state.impacts=state.impacts.includes(k)?state.impacts.filter(x=>x!==k):[...state.impacts,k];render()});document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{state.step=+b.dataset.goto;render()});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const i=+b.dataset.task;state.open=state.open===i?null:i;render()});const sub=document.getElementById('sub');if(sub)sub.onchange=e=>{state.sub=e.target.value;renderContext()};const project=document.getElementById('project');if(project){project.value=state.project;project.onchange=e=>{state.project=e.target.value;renderContext()}}const province=document.getElementById('province');if(province){province.value=state.province;province.onchange=e=>{state.province=e.target.value;renderContext()}}}
    function render(){renderSteps();const screen=document.getElementById('screen');screen.innerHTML=[renderProfile,renderImpacts,renderLocation,renderResult,renderTracker][state.step]();renderContext();wire();const back=document.getElementById('back'),next=document.getElementById('next');back.disabled=state.step===0;back.onclick=()=>{state.step=Math.max(0,state.step-1);render()};next.innerHTML=(state.step===4?'Buka dashboard':state.step===3?'Buat checklist':'Lanjutkan')+' <span>→</span>';next.onclick=()=>{state.step=Math.min(4,state.step+1);render()}}
    render();
  </script>
</body>
</html>
