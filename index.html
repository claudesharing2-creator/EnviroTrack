<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="EnviroTrack — penapisan, checklist, dan tracker kepatuhan lingkungan berbasis KBLI 2025.">
  <meta name="theme-color" content="#143b31">
  <title>EnviroTrack Indonesia</title>
  <link rel="preconnect" href="https://gw.oss.go.id">
  <link rel="stylesheet" href="styles.css?v=20260821-12">
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main class="app">
    <aside class="sidebar" aria-label="Navigasi utama">
      <div>
        <a class="brand" href="#beranda" data-view="home" aria-label="EnviroTrack, buka beranda">
          <span class="logo">e</span><span>EnviroTrack</span>
        </a>
        <p class="tagline">Perizinan lingkungan<br>tanpa kehilangan arah.</p>
        <nav class="nav" id="main-nav">
          <button data-view="home" aria-label="Beranda"><i>⌂</i><span>Beranda</span></button>
          <button data-view="screening" aria-label="Penapisan baru"><i>⌁</i><span>Penapisan baru</span></button>
          <button data-view="projects" aria-label="Proyek saya"><i>□</i><span>Proyek saya</span><em class="pill">3</em></button>
          <button data-view="tasks" aria-label="Checklist tugas"><i>✓</i><span>Checklist tugas</span><em class="pill" id="task-count">12</em></button>
          <button data-view="documents" aria-label="Dokumen"><i>◫</i><span>Dokumen</span></button>
          <button data-view="calendar" aria-label="Kalender"><i>◷</i><span>Kalender</span></button>
          <button data-view="regulations" aria-label="Basis regulasi"><i>§</i><span>Basis regulasi</span></button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <div class="coverage">
          <div class="cover-head"><span>Cakupan prototipe</span><b>KBLI 2025</b></div>
          <div class="bar"><span></span></div>
          <p>38 provinsi + regulasi pusat<br>Pilot lokal Kalimantan Timur</p>
        </div>
        <div class="profile"><span class="avatar">ET</span><div><b>Workspace demo</b><small>Tersimpan lokal di perangkat</small></div></div>
      </div>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div><span class="eyebrow" id="page-eyebrow">PENAPISAN PROYEK</span><h1 id="page-title">Proyek baru</h1></div>
        <div class="top-actions">
          <span class="autosave" id="autosave">✓ Tersimpan di perangkat</span>
          <button class="ghost" data-action="save">Simpan draf</button>
        </div>
      </header>
      <div id="stepbar" class="stepbar"><div class="steps" id="steps"></div></div>
      <div class="content" id="content">
        <section class="panel">
          <div class="screen" id="screen"></div>
          <footer class="panel-footer" id="panel-footer">
            <button class="back" id="back">← Kembali</button>
            <span class="note">Hasil menyesuaikan data yang kamu masukkan</span>
            <button class="next" id="next">Lanjutkan <span>→</span></button>
          </footer>
        </section>
        <aside class="context" id="context" aria-label="Ringkasan proyek"></aside>
      </div>
    </section>
  </main>
  <script src="app-20260821-12.js" defer></script>
</body>
</html>
